<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Cardápio</title>
  <style>
    @page { margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f4ecdf; }
    body {
      font-family: "DejaVu Sans", Arial, Helvetica, sans-serif;
      color: #2c2118;
      -webkit-font-smoothing: antialiased;
    }
    #cardapio {
      width: 1080px;
      min-height: 1350px;
      padding: 58px 68px 46px;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(circle at 0% 0%, rgba(139, 30, 45, 0.09), transparent 38%),
        radial-gradient(circle at 100% 100%, rgba(176, 138, 74, 0.12), transparent 42%),
        linear-gradient(180deg, #fffdf8 0%, #f9f2e7 100%);
    }
    #cardapio::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 2px solid #b08a4a;
      pointer-events: none;
    }
    header {
      text-align: center;
      padding: 14px 0 26px;
    }
    .eyebrow {
      font-size: 18px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #8b1e2d;
      font-weight: 700;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 62px;
      line-height: 1.05;
      margin: 12px 0 10px;
      color: #5c1a24;
    }
    .data {
      font-size: 21px;
      color: #6b5a45;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px auto 0;
      width: 72%;
    }
    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #c9a86a;
      flex: 1;
    }
    .divider span {
      color: #b08a4a;
      font-size: 18px;
    }
    main {
      flex: 1;
      padding: 6px 12px 0;
    }
    .categoria {
      margin: 0 0 30px;
    }
    .categoria:last-child {
      margin-bottom: 0;
    }
    .categoria h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      color: #8b1e2d;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(139, 30, 45, 0.25);
      letter-spacing: 1px;
    }
    .item {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 10px 0;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-nome {
      font-size: 25px;
      font-weight: 700;
      color: #2c2118;
      line-height: 1.25;
    }
    .item-desc {
      font-size: 19px;
      color: #6b5a45;
      margin-top: 3px;
      line-height: 1.35;
    }
    .item-preco {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 700;
      color: #5c1a24;
      white-space: nowrap;
    }
    .obs {
      margin: 8px 12px 0;
      padding: 18px 22px;
      background: rgba(176, 138, 74, 0.13);
      border-left: 5px solid #b08a4a;
      font-size: 20px;
      color: #4a3a2a;
      line-height: 1.45;
    }
    footer {
      margin-top: 34px;
      padding: 20px 12px 0;
      border-top: 1px solid rgba(92, 26, 36, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      font-size: 16px;
      color: #7a6852;
      letter-spacing: 1px;
    }
    .footer-brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      color: #8b1e2d;
    }
  </style>
</head>
<body>
  <div id="cardapio">
    <header>
      <div class="eyebrow">{{TITULO}}</div>
      <h1>{{RESTAURANTE}}</h1>
      <div class="data">{{DATA}}</div>
      <div class="divider"><span>◆</span></div>
    </header>

    <main>
      {{CATEGORIAS}}
      {{OBSERVACOES}}
    </main>

    <footer>
      <span class="footer-brand">{{RESTAURANTE}}</span>
      <span>Cardápio sujeito a alteração</span>
    </footer>
  </div>
</body>
</html>
